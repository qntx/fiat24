name: Drift

# Re-reads every value pinned in data/deployments.json from chain
# (scripts/deployments/verify.ts); any drift fails the job.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/deployments/verify.ts
        env:
          FIAT24_RPC: ${{ secrets.FIAT24_RPC }}
